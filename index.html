<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yaara Aybar</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="signature-image-container">
    <img src="yaara-handwritten.png" alt="Yaara Aybar signature" class="signature-image" />
  </div>  
</div>

  <div class="bookshelf-wrapper">
    <!-- Main base image -->
    <img src="bookshelf-base.png" alt="Bookshelf" class="base-img" />

    <!-- Invisible clickable hotspots -->
    <a href="resume.html" class="hotspot resume" aria-label="Resume"></a>
    <a href="about.html" class="hotspot about" aria-label="About"></a>
    <a href="projects.html" class="hotspot projects" aria-label="Projects"></a>
    <a href="https://www.linkedin.com/in/yaara-aybar" target="_blank" class="hotspot contact" aria-label="Contact"></a>
    
    <!-- Glow overlays (only show on hover) -->
    <img src="bookshelf-resume-glow.png" alt="Resume Glow" class="glow-img resume-glow" />
    <img src="bookshelf-about-glow.png" alt="About Glow" class="glow-img about-glow" />
    <img src="bookshelf-projects-glow.png" alt="Projects Glow" class="glow-img projects-glow" />
    <img src="bookshelf-contact-glow.png" alt="Contact Glow" class="glow-img contact-glow" />
  </div>

</body>
</html>
