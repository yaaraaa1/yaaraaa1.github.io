<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yaara Aybar</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="signature-image-container">
    <img src="yaara-handwritten.png" alt="Yaara Aybar, handwritten" class="signature-image" />
  </div>  
  <div class="bookshelf-wrapper">
    <img src="bookshelf-base.png" alt="Brunette woman smiling with black sweater with a bookshelf background that has clickable sections for Resume, About, Projects, and Contact" class="base-img" />
    <!-- Invisible clickable hotspots -->
    <a href="resume.html" class="hotspot resume" aria-label="Resume section"></a>
    <a href="about.html" class="hotspot about" aria-label="About section"></a>
    <a href="projects.html" class="hotspot projects" aria-label="Projects section"></a>
    <a href="https://www.linkedin.com/in/yaara-aybar" target="_blank" class="hotspot contact" aria-label="Contact (link to LinkedIn)" tabindex="0"></a>
    <!-- Glow overlays (only show on hover) -->
    <img src="bookshelf-resume-glow.png" alt="Highlight glow effect over Resume section of bookshelf" class="glow-img resume-glow" />
    <img src="bookshelf-about-glow.png" alt="Highlight glow effect over About section of bookshelf" class="glow-img about-glow" />
    <img src="bookshelf-projects-glow.png" alt="Highlight glow effect over Projects section of bookshelf" class="glow-img projects-glow" />
    <img src="bookshelf-contact-glow.png" alt="Highlight glow effect over Contact section of bookshelf" class="glow-img contact-glow" />
  </div>
  <div id="focusLabel" class="focus-label" aria-live="polite"></div>
  <div id="sr-status" aria-live="polite" class="sr-only"></div>
</body>

<script>
  const focusLabel = document.getElementById('focusLabel');
  const hotspotMap = {
    'resume': 'Resume',
    'about': 'About',
    'projects': 'Projects',
    'contact': 'Contact'
  };
  document.querySelectorAll('.hotspot').forEach(hotspot => {
    hotspot.addEventListener('focus', () => {
      for (let cls in hotspotMap) {
        if (hotspot.classList.contains(cls)) {
          focusLabel.textContent = `Selected: ${hotspotMap[cls]}`;
          focusLabel.classList.add('visible');
          document.getElementById('sr-status').textContent = `Selected: ${hotspotMap[cls]}`;
          return;
        }
      }
    });
    hotspot.addEventListener('blur', () => {
      focusLabel.classList.remove('visible');
    });
  });
</script>
</html>
